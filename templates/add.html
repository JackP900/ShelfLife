{% extends "base.html" %}

{% block content %}
    <script src="https://unpkg.com/html5-qrcode"></script>
    <div id="reader" style="width:600px"></div>

    <div id="product-form" style="display: none">
        <label>Name: </label><input type="text" id="name" placeholder="Enter Product Name">
        <label>Category: </label><input type="text" id="category" placeholder="Enter Category of Product">
        <label>Original Price:</label><input type="number" id="original_price" placeholder="Enter original Price of Product">
        <label>Expiry: </label><input type="date" id="expiry" placeholder="Enter Date that Product Expires">
        <label>Amount of Stock: </label><input type="number" id="stock" placeholder="Enter Amount of Product">
        <input type="hidden" id="barcode">
        <button id="submit_button">Submit</button>
    </div>

    <script src="{{ url_for('static', filename='js/scanner.js') }}" defer></script>
{% endblock %}
